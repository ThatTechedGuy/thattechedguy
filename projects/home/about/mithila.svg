  <path d="M2 0v1950M10 0v1950M113 0v1950" fill="none" stroke="#000" stroke-width="1.3"/>
  <rect x="113" width="5" height="1950" fill="url(#teeth)" opacity=".7"/>

  <g fill="none" stroke="#000" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
