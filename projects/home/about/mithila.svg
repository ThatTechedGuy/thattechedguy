<svg xmlns="http://www.w3.org/2000/svg" width="120" height="1950" viewBox="0 0 120 1950">
  <!--
    Off the record's side border: original line art in the manner of a Madhubani (Mithila) painting, with
    double outlines, hatched and dotted fills, and a zigzag band between the motifs. It tiles vertically.
    Only the alpha matters: CSS uses this file as a mask and paints it in the paper's ink colour, so it
    follows every palette. Each motif sits in a 150-unit cell, drawn in a 100-unit box.
  -->
  <defs>
    <pattern id="hatch" width="3.5" height="3.5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0v3.5" stroke="#000" stroke-width=".9"/>
    </pattern>
    <pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r=".8"/>
    </pattern>
    <pattern id="zigzag" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 7l3.5-7L7 7" fill="none" stroke="#000" stroke-width=".9"/>
    </pattern>
    <pattern id="teeth" width="6" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 0l6 4-6 4z"/>
    </pattern>
    <clipPath id="racquet-face">
      <ellipse cx="46" cy="34" rx="16" ry="22"/>
    </clipPath>
    <!-- Hollows the dragon's thick stroke into two parallel outlines. -->
    <mask id="dragon-hollow" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#fff"/>
      <path d="M16 90C40 96 76 90 72 74 68 58 26 66 26 50 26 34 52 30 64 26" fill="none" stroke="#000" stroke-width="7.6" stroke-linecap="round"/>
    </mask>
  </defs>

